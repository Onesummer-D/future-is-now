<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未来已来</title>
<script src="data.js"></script>
<style>
  :root{
    --bg:#f6f4ee; --card:#fffefa; --line:#e5e0d5; --line2:#d5cebf;
    --ink:#26231e; --dim:#57503f; --faint:#8a8272;
    --serif:Georgia,"Source Han Serif SC","Noto Serif SC",serif;
    --acc:#b4532a; --ok:#3a6b4f; --warn:#a06a2e; --bad:#a03d2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--ink);padding:32px 20px;max-width:880px;margin:0 auto;font-size:16px;line-height:1.7}
  a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc)}
  header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
  h1{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:3px}
  h1::after{content:".";color:var(--acc)}
  h1 .en{font-size:13px;letter-spacing:4px;color:var(--dim);font-weight:400;margin-left:12px;vertical-align:3px}
  .upd{font-size:14px;color:var(--dim);font-family:var(--serif);letter-spacing:1px}
  section{margin-bottom:32px}
  h2{font-size:14px;letter-spacing:4px;color:var(--dim);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;border-top:1px solid var(--line2)}
  h2 b{font-family:var(--serif);color:var(--acc);font-weight:600;font-size:17px;margin-right:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:22px 24px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .stat .lab{font-size:14px;color:var(--dim);letter-spacing:1px}
  .stat .num{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1.15}
  .stat .num::after{content:".";color:var(--acc)}
  .stat .num small{font-size:15px;color:var(--dim);font-weight:400;margin-left:4px}
  .stat .foot{font-size:14px;color:var(--dim)}
  .ring{display:flex;align-items:center;gap:16px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rn{font-family:var(--serif);font-size:34px;font-weight:700}
  .ring .rn::after{content:".";color:var(--acc)}
  .ring .rs{font-size:14px;color:var(--dim)}
  .kpis{display:flex;flex-direction:column;gap:8px}
  .kpi{display:flex;justify-content:space-between;align-items:center;font-size:15px}
  .kpi b{font-weight:600}
  .kbar{flex:1;height:4px;background:var(--line);border-radius:2px;margin:0 12px;overflow:hidden}
  .kbar i{display:block;height:100%}
  .bars{display:flex;align-items:flex-end;gap:20px;height:150px;padding-top:10px}
  .bar{flex:1;max-width:72px;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bar .v{font-family:var(--serif);font-size:16px;font-weight:700}
  .bar .col{width:100%;border-radius:3px 3px 0 0;min-height:4px}
  .bar .w{font-size:13px;letter-spacing:1px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{color:var(--dim);text-align:left;font-weight:600;padding:8px;border-bottom:2px solid var(--line2);font-size:14px}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .ok{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600}
  .score{font-weight:700}
  .s-good{color:var(--ok)} .s-mid{color:var(--warn)} .s-bad{color:var(--bad)}
  .rev .meta{font-size:14px;color:var(--dim);margin-bottom:8px}
  .rev .line{margin:6px 0;font-size:15px}
  .rev .goal{margin:8px 0 0 20px;font-size:15px}
  .rev .goal li{margin:4px 0}
  .anchors li{margin:6px 0 6px 18px;font-size:15px}
  .anchors b{color:var(--acc)}
  .empty{color:var(--dim);font-size:15px;padding:16px;text-align:center}
  footer{margin-top:30px;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>

<header>
  <h1>未来已来<span class="en">FUTURE IS NOW</span></h1>
  <div class="upd">数据更新于 <span id="upd"></span></div>
</header>

<section>
  <div class="row">
    <div class="card stat">
      <div class="lab">连续打卡</div>
      <div class="num" id="streak">0<small>天</small></div>
      <div class="foot" id="best">历史最佳 0 天</div>
    </div>
    <div class="card stat">
      <div class="lab">本周完成率</div>
      <div class="ring">
        <svg width="78" height="78"><circle cx="39" cy="39" r="33" stroke="#e5e0d5" stroke-width="8" fill="none"/>
        <circle id="ring" cx="39" cy="39" r="33" stroke="#3a6b4f" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="207" stroke-dashoffset="207"/></svg>
        <div><div class="rn" id="weekRate">—</div><div class="rs" id="weekCount">本周暂无记录</div></div>
      </div>
    </div>
    <div class="card stat">
      <div class="lab">本周三类达成</div>
      <div class="kpis" id="kpis">
        <div class="kpi"><b>学业</b><span class="kbar"><i style="background:#3a6b4f;width:0%"></i></span><span id="kStudy">0/0</span></div>
        <div class="kpi"><b>科研</b><span class="kbar"><i style="background:#b4532a;width:0%"></i></span><span id="kBonus">0/0</span></div>
        <div class="kpi"><b>素质</b><span class="kbar"><i style="background:#6f6659;width:0%"></i></span><span id="kVirtue">0/0</span></div>
      </div>
    </div>
  </div>
</section>

<section>
  <h2><b>01</b>近8周完成率</h2>
  <div class="card"><div class="bars" id="trend"></div></div>
</section>

<section>
  <h2><b>02</b>每日验收记录（最近7天）</h2>
  <div class="card" style="padding:8px 12px">
    <table id="dayTable">
      <thead><tr><th>日期</th><th>当日计划</th><th>学业</th><th>科研</th><th>素质</th><th>得分</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="dayEmpty" style="display:none">还没有记录。每晚00:30验收后会在这里出现</div>
  </div>
</section>

<section>
  <h2><b>03</b>历史验收记录（最近60天）</h2>
  <div class="card" style="padding:8px 12px">
    <table id="histTable">
      <thead><tr><th>日期</th><th>当日计划</th><th>学业</th><th>科研</th><th>素质</th><th>得分</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="histEmpty" style="display:none">暂无历史记录</div>
  </div>
</section>

<section>
  <h2><b>04</b>最近一次周复盘</h2>
  <div class="card rev" id="review"><div class="empty">每周日00:30自动生成：完成率统计、最好与最薄弱项、下周计划</div></div>
</section>

<section>
  <h2><b>05</b>学期锚点</h2>
  <div class="card"><ul class="anchors" id="anchors"></ul></div>
</section>

<footer>
  <span>每晚00:30自动化写入 data.js</span>
  <span><a href="workbench.html">Future is Now</a> · 学习面板</span>
</footer>

<script>
const $=id=>document.getElementById(id);
const DOW=["日","一","二","三","四","五","六"];
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function weekOf(dateStr){
  const [y,m,dd]=dateStr.split("-").map(Number);
  const d=new Date(y,m-1,dd);
  const day=d.getDay()||7;
  const monday=new Date(y,m-1,dd-day+1);
  const thu=new Date(monday); thu.setDate(monday.getDate()+3);
  const jan1=new Date(thu.getFullYear(),0,1);
  const w=Math.floor((thu-jan1)/864e5/7)+1;
  return thu.getFullYear()*100+w;
}
function mondayStr(off){
  const d=new Date(); const day=d.getDay()||7;
  const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+1+off*7);
  const p=n=>String(n).padStart(2,"0");
  return `${mon.getFullYear()}-${p(mon.getMonth()+1)}-${p(mon.getDate())}`;
}
function localDow(dateStr){const [y,m,dd]=dateStr.split("-").map(Number);return new Date(y,m-1,dd).getDay();}
const days=(DATA.days||[]).slice();
const d0=new Date();d0.setDate(d0.getDate()-6);const p0=n=>String(n).padStart(2,"0");
const cutStr=d0.getFullYear()+"-"+p0(d0.getMonth()+1)+"-"+p0(d0.getDate());
const tStr=(d=>d.getFullYear()+"-"+p0(d.getMonth()+1)+"-"+p0(d.getDate()))(new Date());
const thisWeek=days.filter(d=>d.date>=cutStr&&d.date<=tStr);

$("upd").textContent=DATA.meta.updated||"—";

const st=DATA.streak||{current:0,best:0};
$("streak").innerHTML=st.current+"<small>天</small>";
$("best").textContent="历史最佳 "+st.best+" 天";

const rate=thisWeek.length?Math.round(thisWeek.reduce((s,d)=>s+(d.score||0),0)/thisWeek.length):null;
$("weekRate").textContent=rate===null?"—":rate+"%";
const col=rate===null?"#d5cebf":rate>=80?"#3a6b4f":rate>=60?"#a06a2e":"#a03d2e";
$("ring").setAttribute("stroke-dashoffset",207*(1-(rate||0)/100));
$("ring").setAttribute("stroke",col);
$("weekCount").textContent="本周已验收 "+thisWeek.length+" 天";

if(thisWeek.length){
  const sum=k=>thisWeek.reduce((s,d)=>s+((d.cats&&d.cats[k])||0),0);
  const n=thisWeek.length;
  const set=(id,v)=>{
    $(id).textContent=v+"/"+n;
    const bar=$(id).closest(".kpi").querySelector(".kbar i");
    bar.style.width=Math.round(v/n*100)+"%";
    bar.style.background=v/n>=0.8?"#3a6b4f":v/n>=0.5?"#a06a2e":"#a03d2e";
  };
  set("kStudy",sum("study")); set("kBonus",sum("bonus")); set("kVirtue",sum("virtue"));
}

const weeks={};
days.forEach(d=>{const w=weeks[d.week]=weeks[d.week]||{arr:[],first:d.date};(weeks[d.week].arr).push(d.score||0);if(d.date<weeks[d.week].first)weeks[d.week].first=d.date;});
const keys=Object.keys(weeks).sort().slice(-8);
if(keys.length){
  $("trend").innerHTML=keys.map(w=>{
    const o=weeks[w]; const r=Math.round(o.arr.reduce((a,b)=>a+b,0)/o.arr.length);
    const c=r>=80?"#3a6b4f":r>=60?"#a06a2e":"#a03d2e";
    const lab=o.first.slice(5).replace("-",".");
    return `<div class="bar"><div class="v" style="color:${c}">${r}</div><div class="col" style="height:${Math.max(4,r*0.85)}%;background:${c}"></div><div class="w">${lab}周</div></div>`;
  }).join("");
}else{
  $("trend").innerHTML='<div class="empty" style="width:100%">打卡后这里会出现每周趋势</div>';
}

function rowHtml(d){
  const mark=v=>v===1?'<span class="ok">完成</span>':v===0?'<span class="no">未完成</span>':"—";
  const sc=d.score>=80?'<span class="score s-good">'+d.score+"</span>":d.score>=60?'<span class="score s-mid">'+d.score+"</span>":'<span class="score s-bad">'+d.score+"</span>";
  const plan=(d.plan&&d.plan.length)?d.plan.map(p=>esc(p)).join("<br>"):"—";
  const tip=[d.q&&d.q.study,d.q&&d.q.bonus,d.q&&d.q.virtue].filter(Boolean).map(esc).join("　|　");
  return `<tr><td>${esc(d.date)}<br><span style="color:var(--dim);font-size:12px">周${DOW[localDow(d.date)]}</span></td><td>${plan}</td><td title="${tip}">${mark(d.cats&&d.cats.study)}</td><td title="${tip}">${mark(d.cats&&d.cats.bonus)}</td><td title="${tip}">${mark(d.cats&&d.cats.virtue)}</td><td>${sc}</td></tr>`;
}
const tb=$("dayTable").querySelector("tbody");
if(thisWeek.length){
  tb.innerHTML=thisWeek.slice().reverse().map(rowHtml).join("");
}else{$("dayEmpty").style.display="block";$("dayTable").style.display="none";}
const allDays=days.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
const hb=$("histTable").querySelector("tbody");
if(allDays.length){
  hb.innerHTML=allDays.map(rowHtml).join("");
}else{$("histEmpty").style.display="block";$("histTable").style.display="none";}

const rv=(DATA.weeklyReviews||[]).slice(-1)[0];
if(rv){
  $("review").innerHTML=`
  <div class="meta">第${esc(String(rv.week).slice(4))}周 · ${esc(rv.date)} · 完成率 ${esc(rv.rate)}%</div>
  <div class="line">做得好：<span style="color:var(--ok)">${esc(rv.good)}</span></div>
  <div class="line">最薄弱：<span style="color:var(--bad)">${esc(rv.weak)}</span></div>
  <div class="line" style="margin-top:10px;font-weight:600">下周目标</div>
  <ul class="goal">${(rv.nextGoals||[]).map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`;
}

$("anchors").innerHTML=[
  `<li><b>${esc(DATA.anchors.gpaTarget)}</b></li>`,
  `<li>${esc(DATA.anchors.courseFloor)}</li>`,
  ...DATA.anchors.semesterGoals.map(g=>`<li>${esc(g)}</li>`),
].join("");
</script>
</body>
</html>
